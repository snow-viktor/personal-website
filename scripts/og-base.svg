<!-- OG image base layer (1200x630), rasterized by scripts/generate-og.mjs.
     Borrows the homepage hero's language: ink background, three layered
     brand-hue radials (orange/blue/gold, alpha below web values so the card
     stays quiet in a feed), and the favicon's moon-and-mountain mark enlarged
     on the right. The text layer is a separate satori render composited on top. -->
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="mark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e48a4a" />
      <stop offset="50%" stop-color="#d4a060" />
      <stop offset="100%" stop-color="#7a9ec0" />
    </linearGradient>
    <radialGradient id="glow-orange">
      <stop offset="0%" stop-color="#e48a4a" stop-opacity="0.28" />
      <stop offset="70%" stop-color="#e48a4a" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glow-blue">
      <stop offset="0%" stop-color="#7a9ec0" stop-opacity="0.2" />
      <stop offset="70%" stop-color="#7a9ec0" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glow-gold">
      <stop offset="0%" stop-color="#d4a060" stop-opacity="0.15" />
      <stop offset="70%" stop-color="#d4a060" stop-opacity="0" />
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="#0f0f11" />

  <!-- Hero glow, re-proportioned for the 1200x630 canvas. -->
  <ellipse cx="168" cy="-38" rx="480" ry="260" fill="url(#glow-orange)" />
  <ellipse cx="1056" cy="25" rx="400" ry="240" fill="url(#glow-blue)" />
  <ellipse cx="696" cy="705" rx="380" ry="260" fill="url(#glow-gold)" />

  <!-- favicon.svg mark, enlarged 13x: moon over mountain, top-right. -->
  <g transform="translate(832, 107) scale(13)" opacity="0.85">
    <circle cx="16" cy="11" r="5" fill="url(#mark)" />
    <path
      d="M10 26 L16 17 L22 26 Z"
      fill="url(#mark)"
      stroke="url(#mark)"
      stroke-width="1.5"
      stroke-linejoin="round"
    />
  </g>
</svg>
